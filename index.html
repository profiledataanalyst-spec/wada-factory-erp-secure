<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Factory ERP with Supabase temporary passwords, forced first-login password change and role-based access" />
  <title>Factory ERP</title>
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml" />
  <style>
:root {
  --bg: #f4f7f9;
  --surface: #ffffff;
  --surface-2: #f8fafc;
  --surface-3: #eef4f4;
  --text: #14212b;
  --muted: #64748b;
  --line: #dbe4ea;
  --primary: #0f766e;
  --primary-2: #115e59;
  --primary-soft: #dff6f2;
  --accent: #e8871e;
  --success: #18864b;
  --success-soft: #e8f7ef;
  --warning: #c56a08;
  --warning-soft: #fff4e6;
  --danger: #c43d3d;
  --danger-soft: #fdecec;
  --info: #2563eb;
  --info-soft: #eaf1ff;
  --shadow: 0 10px 30px rgba(15, 23, 42, 0.08);
  --shadow-sm: 0 4px 16px rgba(15, 23, 42, 0.07);
  --radius: 16px;
  --radius-sm: 10px;
  --sidebar: 260px;
  --topbar: 72px;
}

[data-theme="dark"] {
  --bg: #0c1419;
  --surface: #111d24;
  --surface-2: #16252e;
  --surface-3: #1a2e35;
  --text: #edf6f5;
  --muted: #9fb1bd;
  --line: #29404a;
  --primary: #24a89c;
  --primary-2: #53c7bc;
  --primary-soft: #163b39;
  --success-soft: #123624;
  --warning-soft: #392815;
  --danger-soft: #3f2023;
  --info-soft: #172a50;
  --shadow: 0 12px 32px rgba(0, 0, 0, 0.25);
  --shadow-sm: 0 5px 16px rgba(0, 0, 0, 0.2);
}

* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body {
  margin: 0;
  font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
}
button, input, select, textarea { font: inherit; }
button { cursor: pointer; }
a { color: inherit; }
.hidden { display: none !important; }
.muted { color: var(--muted); }
.small { font-size: 12px; }
.text-danger { color: var(--danger); }
.text-success { color: var(--success); }
.text-warning { color: var(--warning); }
.text-primary { color: var(--primary); }
.w-100 { width: 100%; }
.mb-0 { margin-bottom: 0 !important; }
.mt-0 { margin-top: 0 !important; }

.auth-shell {
  min-height: 100vh;
  display: grid;
  grid-template-columns: 1.1fr .9fr;
  background:
    radial-gradient(circle at 12% 12%, rgba(15,118,110,.22), transparent 34%),
    radial-gradient(circle at 88% 88%, rgba(232,135,30,.18), transparent 28%),
    var(--bg);
}
.auth-visual {
  padding: 64px;
  background: linear-gradient(150deg, #073b38 0%, #0f766e 60%, #0b5c56 100%);
  color: white;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  min-height: 100vh;
  position: relative;
  overflow: hidden;
}
.auth-visual::before,
.auth-visual::after {
  content: "";
  position: absolute;
  border: 1px solid rgba(255,255,255,.16);
  border-radius: 50%;
}
.auth-visual::before { width: 480px; height: 480px; right: -180px; top: -150px; }
.auth-visual::after { width: 320px; height: 320px; left: -110px; bottom: -120px; }
.brand-lockup { display: flex; align-items: center; gap: 14px; position: relative; z-index: 1; }
.brand-mark {
  width: 46px; height: 46px; border-radius: 13px;
  display: grid; place-items: center;
  background: rgba(255,255,255,.16);
  border: 1px solid rgba(255,255,255,.28);
  font-weight: 800; letter-spacing: .5px;
}
.brand-lockup h1 { margin: 0; font-size: 22px; }
.brand-lockup p { margin: 3px 0 0; opacity: .72; font-size: 12px; }
.auth-hero { max-width: 600px; position: relative; z-index: 1; }
.auth-hero h2 { font-size: clamp(36px, 5vw, 62px); line-height: 1.05; margin: 0 0 20px; letter-spacing: -2px; }
.auth-hero p { font-size: 17px; line-height: 1.7; color: rgba(255,255,255,.82); }
.auth-stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; margin-top: 32px; }
.auth-stat { padding: 18px; border-radius: 14px; background: rgba(255,255,255,.11); border: 1px solid rgba(255,255,255,.15); backdrop-filter: blur(8px); }
.auth-stat strong { display: block; font-size: 22px; }
.auth-stat span { display: block; font-size: 12px; opacity: .75; margin-top: 5px; }
.auth-foot { font-size: 12px; opacity: .65; position: relative; z-index: 1; }
.auth-panel { display: flex; align-items: center; justify-content: center; padding: 36px; }
.auth-card { width: min(480px, 100%); background: var(--surface); border: 1px solid var(--line); border-radius: 24px; padding: 34px; box-shadow: var(--shadow); }
.auth-card h2 { margin: 0 0 8px; font-size: 28px; }
.auth-card > p { margin: 0 0 28px; color: var(--muted); line-height: 1.6; }
.auth-note { background: var(--warning-soft); color: var(--warning); border: 1px solid color-mix(in srgb, var(--warning) 25%, transparent); border-radius: 12px; padding: 12px 14px; font-size: 12px; line-height: 1.5; margin-top: 16px; }

.app-shell { min-height: 100vh; }
.sidebar {
  position: fixed; inset: 0 auto 0 0;
  width: var(--sidebar);
  background: #0b3f3b;
  color: #e7fffc;
  z-index: 30;
  display: flex; flex-direction: column;
  transition: width .25s ease, transform .25s ease;
}
.sidebar .brand-area { height: var(--topbar); padding: 14px 18px; display: flex; align-items: center; gap: 12px; border-bottom: 1px solid rgba(255,255,255,.1); }
.sidebar .brand-area .brand-mark { width: 40px; height: 40px; min-width: 40px; }
.sidebar .brand-copy { overflow: hidden; white-space: nowrap; }
.sidebar .brand-copy strong { display: block; font-size: 15px; }
.sidebar .brand-copy small { opacity: .68; font-size: 10px; }
.nav-scroll { flex: 1; overflow-y: auto; padding: 14px 10px; }
.nav-section-title { padding: 14px 12px 8px; font-size: 10px; letter-spacing: 1.5px; text-transform: uppercase; color: rgba(231,255,252,.48); }
.nav-item {
  width: 100%; display: flex; align-items: center; gap: 12px;
  border: 0; color: rgba(231,255,252,.78); background: transparent;
  padding: 11px 12px; border-radius: 10px; text-align: left; margin: 2px 0;
  transition: .18s ease;
}
.nav-item:hover { background: rgba(255,255,255,.08); color: white; }
.nav-item.active { background: rgba(255,255,255,.15); color: white; box-shadow: inset 3px 0 0 #6ee7d8; }
.nav-icon { width: 22px; text-align: center; font-size: 17px; }
.nav-label { font-size: 13px; white-space: nowrap; }
.sidebar-bottom { padding: 12px; border-top: 1px solid rgba(255,255,255,.1); }
.user-mini { display: flex; align-items: center; gap: 10px; padding: 9px; border-radius: 12px; background: rgba(255,255,255,.07); }
.avatar { width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; background: var(--primary-soft); color: var(--primary); font-weight: 750; }
.sidebar .avatar { background: rgba(255,255,255,.16); color: white; }
.user-mini .user-info { min-width: 0; flex: 1; }
.user-mini .user-info strong { display: block; font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.user-mini .user-info span { display: block; font-size: 10px; opacity: .66; margin-top: 2px; }

.topbar {
  position: fixed; left: var(--sidebar); right: 0; top: 0; height: var(--topbar);
  background: color-mix(in srgb, var(--surface) 92%, transparent);
  backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--line);
  display: flex; align-items: center; gap: 16px;
  padding: 0 24px; z-index: 20;
  transition: left .25s ease;
}
.topbar-left { display: flex; align-items: center; gap: 12px; min-width: 210px; }
.page-heading h1 { margin: 0; font-size: 18px; }
.page-heading small { color: var(--muted); font-size: 11px; }
.topbar-search { flex: 1; max-width: 600px; position: relative; }
.topbar-search input { width: 100%; padding-left: 40px; background: var(--surface-2); border-color: transparent; }
.topbar-search .search-icon { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: var(--muted); }
.topbar-actions { margin-left: auto; display: flex; align-items: center; gap: 8px; }
.icon-btn { width: 39px; height: 39px; border-radius: 11px; border: 1px solid var(--line); background: var(--surface); color: var(--text); display: grid; place-items: center; position: relative; }
.icon-btn:hover { border-color: var(--primary); color: var(--primary); }
.badge-dot { position: absolute; top: 6px; right: 6px; min-width: 16px; height: 16px; padding: 0 4px; border-radius: 20px; background: var(--danger); color: white; font-size: 9px; display: grid; place-items: center; border: 2px solid var(--surface); }
.mobile-menu-btn { display: none; }

.main-content { margin-left: var(--sidebar); padding: calc(var(--topbar) + 24px) 24px 40px; min-height: 100vh; transition: margin-left .25s ease; }
.content-wrap { max-width: 1700px; margin: 0 auto; }
.page-toolbar { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; margin-bottom: 20px; }
.page-toolbar h2 { margin: 0 0 5px; font-size: 23px; }
.page-toolbar p { margin: 0; color: var(--muted); font-size: 13px; }
.toolbar-actions { display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }

.grid { display: grid; gap: 18px; }
.grid-2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.grid-3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.grid-4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
.grid-5 { grid-template-columns: repeat(5, minmax(0, 1fr)); }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow-sm); }
.card-header { padding: 18px 20px 12px; display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.card-header h3 { margin: 0; font-size: 15px; }
.card-header p { margin: 5px 0 0; color: var(--muted); font-size: 11px; }
.card-body { padding: 18px 20px 20px; }
.card-header + .card-body { padding-top: 8px; }

.kpi-card { padding: 18px; display: flex; align-items: center; gap: 14px; position: relative; overflow: hidden; }
.kpi-card::after { content: ""; position: absolute; width: 90px; height: 90px; border-radius: 50%; right: -32px; top: -35px; background: var(--primary-soft); opacity: .65; }
.kpi-icon { width: 46px; height: 46px; min-width: 46px; border-radius: 13px; background: var(--primary-soft); color: var(--primary); display: grid; place-items: center; font-size: 20px; position: relative; z-index: 1; }
.kpi-copy { min-width: 0; position: relative; z-index: 1; }
.kpi-copy span { font-size: 11px; color: var(--muted); display: block; margin-bottom: 6px; }
.kpi-copy strong { font-size: 24px; line-height: 1; }
.kpi-meta { display: block; margin-top: 7px; font-size: 10px; color: var(--muted); }

.btn { border: 1px solid transparent; border-radius: 10px; padding: 9px 14px; display: inline-flex; align-items: center; justify-content: center; gap: 7px; font-weight: 650; font-size: 12px; transition: .18s ease; }
.btn:disabled { opacity: .48; cursor: not-allowed; }
.btn-primary { background: var(--primary); color: white; }
.btn-primary:hover { background: var(--primary-2); }
.btn-secondary { background: var(--surface); border-color: var(--line); color: var(--text); }
.btn-secondary:hover { border-color: var(--primary); color: var(--primary); }
.btn-danger { background: var(--danger); color: white; }
.btn-warning { background: var(--warning); color: white; }
.btn-success { background: var(--success); color: white; }
.btn-ghost { background: transparent; color: var(--muted); padding: 7px 9px; }
.btn-ghost:hover { background: var(--surface-2); color: var(--text); }
.btn-sm { padding: 6px 10px; border-radius: 8px; font-size: 11px; }
.btn-lg { padding: 12px 18px; font-size: 13px; }

.form-group { margin-bottom: 16px; }
.form-group label { display: block; font-size: 12px; font-weight: 650; margin-bottom: 7px; }
.form-grid { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 14px; }
.input, input, select, textarea {
  width: 100%; border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px;
  color: var(--text); background: var(--surface); outline: none; transition: .18s ease;
}
input:focus, select:focus, textarea:focus { border-color: var(--primary); box-shadow: 0 0 0 3px color-mix(in srgb, var(--primary) 15%, transparent); }
textarea { min-height: 90px; resize: vertical; }
.help-text { margin-top: 6px; color: var(--muted); font-size: 10px; line-height: 1.5; }
.input-error { color: var(--danger); font-size: 11px; margin-top: 6px; }
.input-row { display: flex; gap: 8px; align-items: center; }

.filter-bar { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 12px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-bottom: 16px; }
.filter-bar .filter-item { min-width: 150px; flex: 1 1 160px; }
.filter-bar .filter-item.search-wide { flex: 2 1 260px; }

.table-card { overflow: hidden; }
.table-wrap { overflow: auto; }
table { width: 100%; border-collapse: collapse; min-width: 850px; }
th, td { padding: 12px 14px; text-align: left; border-bottom: 1px solid var(--line); font-size: 12px; vertical-align: middle; }
th { background: var(--surface-2); color: var(--muted); font-size: 10px; text-transform: uppercase; letter-spacing: .7px; position: sticky; top: 0; z-index: 2; }
tbody tr:hover { background: color-mix(in srgb, var(--primary-soft) 35%, transparent); }
.table-actions { display: flex; align-items: center; gap: 5px; }
.table-stage-select { min-width: 180px; padding: 8px 10px; }
.table-footer { padding: 12px 16px; display: flex; align-items: center; justify-content: space-between; gap: 12px; color: var(--muted); font-size: 11px; }

.status { display: inline-flex; align-items: center; gap: 6px; padding: 5px 9px; border-radius: 999px; font-size: 10px; font-weight: 700; white-space: nowrap; }
.status::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.status-active, .status-completed, .status-approved, .status-ready { background: var(--success-soft); color: var(--success); }
.status-pending, .status-planning, .status-in-progress { background: var(--warning-soft); color: var(--warning); }
.status-delayed, .status-rejected, .status-hold { background: var(--danger-soft); color: var(--danger); }
.status-info, .status-submitted { background: var(--info-soft); color: var(--info); }
.status-neutral { background: var(--surface-3); color: var(--muted); }
.role-chip { font-size: 9px; font-weight: 750; border-radius: 6px; padding: 4px 7px; background: var(--primary-soft); color: var(--primary); }

.chart-box { height: 280px; position: relative; }
.chart-box canvas { width: 100%; height: 100%; }
.legend { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 12px; }
.legend-item { display: flex; align-items: center; gap: 6px; color: var(--muted); font-size: 10px; }
.legend-dot { width: 8px; height: 8px; border-radius: 3px; }

.activity-list { display: grid; gap: 4px; }
.activity-item { display: grid; grid-template-columns: 36px 1fr auto; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--line); }
.activity-item:last-child { border-bottom: 0; }
.activity-icon { width: 34px; height: 34px; border-radius: 10px; background: var(--primary-soft); color: var(--primary); display: grid; place-items: center; }
.activity-main strong { font-size: 11px; display: block; margin-bottom: 4px; }
.activity-main span { font-size: 10px; color: var(--muted); line-height: 1.4; }
.activity-time { font-size: 9px; color: var(--muted); white-space: nowrap; }

.progress-line { height: 7px; border-radius: 999px; background: var(--surface-3); overflow: hidden; }
.progress-line > span { display: block; height: 100%; border-radius: inherit; background: linear-gradient(90deg, var(--primary), #45b7aa); }
.progress-meta { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-top: 7px; font-size: 10px; color: var(--muted); }

.timeline { display: flex; align-items: flex-start; overflow-x: auto; padding: 18px 6px 10px; }
.timeline-stage { min-width: 130px; flex: 1; position: relative; text-align: center; padding: 0 8px; }
.timeline-stage::before { content: ""; position: absolute; height: 4px; left: -50%; right: 50%; top: 22px; background: var(--line); z-index: 0; }
.timeline-stage:first-child::before { display: none; }
.timeline-stage.completed::before, .timeline-stage.current::before { background: var(--success); }
.timeline-stage.delayed::before { background: var(--danger); }
.stage-circle { width: 48px; height: 48px; margin: 0 auto 10px; border-radius: 50%; display: grid; place-items: center; background: var(--surface-3); color: var(--muted); border: 4px solid var(--surface); box-shadow: 0 0 0 2px var(--line); position: relative; z-index: 1; font-weight: 800; }
.timeline-stage.completed .stage-circle { background: var(--success); color: white; box-shadow: 0 0 0 2px var(--success); }
.timeline-stage.current .stage-circle { background: var(--warning); color: white; box-shadow: 0 0 0 2px var(--warning); animation: pulse 1.7s infinite; }
.timeline-stage.delayed .stage-circle { background: var(--danger); color: white; box-shadow: 0 0 0 2px var(--danger); }
.timeline-stage.submitted .stage-circle { background: var(--info); color: white; box-shadow: 0 0 0 2px var(--info); }
.stage-name { font-size: 10px; font-weight: 750; line-height: 1.4; }
.stage-meta { font-size: 9px; color: var(--muted); margin-top: 4px; line-height: 1.4; }
@keyframes pulse { 0%,100% { box-shadow: 0 0 0 2px var(--warning), 0 0 0 0 rgba(197,106,8,.28); } 50% { box-shadow: 0 0 0 2px var(--warning), 0 0 0 10px rgba(197,106,8,0); } }

.empty-state { text-align: center; padding: 48px 24px; color: var(--muted); }
.empty-icon { width: 64px; height: 64px; border-radius: 18px; margin: 0 auto 14px; display: grid; place-items: center; background: var(--primary-soft); color: var(--primary); font-size: 28px; }
.empty-state h3 { color: var(--text); margin: 0 0 6px; font-size: 16px; }
.empty-state p { margin: 0 auto 16px; font-size: 11px; line-height: 1.6; max-width: 420px; }

.modal-backdrop { position: fixed; inset: 0; z-index: 100; background: rgba(4, 14, 20, .64); backdrop-filter: blur(5px); display: flex; align-items: center; justify-content: center; padding: 20px; }
.modal { width: min(680px, 100%); max-height: min(88vh, 900px); overflow: auto; background: var(--surface); border-radius: 20px; border: 1px solid var(--line); box-shadow: 0 28px 70px rgba(0,0,0,.3); }
.modal-lg { width: min(1050px, 100%); }
.modal-xl { width: min(1300px, 100%); }
.modal-header { position: sticky; top: 0; z-index: 3; background: var(--surface); padding: 18px 22px; border-bottom: 1px solid var(--line); display: flex; align-items: center; justify-content: space-between; gap: 14px; }
.modal-header h3 { margin: 0; font-size: 18px; }
.modal-body { padding: 22px; }
.modal-footer { position: sticky; bottom: 0; z-index: 3; background: var(--surface); padding: 14px 22px; border-top: 1px solid var(--line); display: flex; justify-content: flex-end; gap: 8px; }
.close-btn { width: 34px; height: 34px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); color: var(--text); }

.toast-container { position: fixed; right: 18px; bottom: 18px; z-index: 200; display: grid; gap: 10px; width: min(360px, calc(100vw - 36px)); }
.toast { background: var(--surface); border: 1px solid var(--line); border-left: 4px solid var(--primary); border-radius: 12px; padding: 13px 14px; box-shadow: var(--shadow); display: grid; grid-template-columns: 24px 1fr; gap: 9px; animation: slideIn .22s ease; }
.toast.success { border-left-color: var(--success); }
.toast.error { border-left-color: var(--danger); }
.toast.warning { border-left-color: var(--warning); }
.toast strong { font-size: 11px; display: block; margin-bottom: 3px; }
.toast span { font-size: 10px; color: var(--muted); line-height: 1.4; }
@keyframes slideIn { from { opacity: 0; transform: translateX(20px); } }

.import-drop { border: 2px dashed var(--line); border-radius: 16px; padding: 36px; text-align: center; transition: .2s ease; background: var(--surface-2); }
.import-drop:hover, .import-drop.dragover { border-color: var(--primary); background: var(--primary-soft); }
.import-drop .drop-icon { font-size: 40px; color: var(--primary); margin-bottom: 10px; }
.import-drop h3 { margin: 0 0 6px; }
.import-drop p { margin: 0 0 16px; color: var(--muted); font-size: 11px; }
.import-steps { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-bottom: 18px; }
.import-step { padding: 10px; border: 1px solid var(--line); border-radius: 10px; text-align: center; font-size: 10px; color: var(--muted); background: var(--surface); }
.import-step.active { color: var(--primary); border-color: var(--primary); background: var(--primary-soft); font-weight: 750; }
.import-step.done { color: var(--success); border-color: var(--success); background: var(--success-soft); }
.validation-summary { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; margin-bottom: 16px; }
.validation-box { padding: 12px; border-radius: 11px; background: var(--surface-2); border: 1px solid var(--line); }
.validation-box strong { display: block; font-size: 20px; }
.validation-box span { display: block; color: var(--muted); font-size: 9px; margin-top: 4px; text-transform: uppercase; letter-spacing: .6px; }

.info-banner { border-radius: 13px; padding: 14px 16px; display: flex; gap: 11px; align-items: flex-start; margin-bottom: 18px; background: var(--info-soft); color: var(--info); border: 1px solid color-mix(in srgb, var(--info) 22%, transparent); }
.info-banner.warning { background: var(--warning-soft); color: var(--warning); border-color: color-mix(in srgb, var(--warning) 22%, transparent); }
.info-banner.danger { background: var(--danger-soft); color: var(--danger); border-color: color-mix(in srgb, var(--danger) 22%, transparent); }
.info-banner strong { display: block; font-size: 11px; margin-bottom: 4px; }
.info-banner p { margin: 0; font-size: 10px; line-height: 1.55; }

.tabs { display: flex; gap: 5px; border-bottom: 1px solid var(--line); margin-bottom: 18px; overflow-x: auto; }
.tab { border: 0; border-bottom: 2px solid transparent; padding: 10px 13px; color: var(--muted); background: transparent; font-size: 11px; font-weight: 650; white-space: nowrap; }
.tab.active { color: var(--primary); border-bottom-color: var(--primary); }

.setting-row { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 16px 0; border-bottom: 1px solid var(--line); }
.setting-row:last-child { border-bottom: 0; }
.setting-copy strong { font-size: 12px; display: block; margin-bottom: 4px; }
.setting-copy span { font-size: 10px; color: var(--muted); line-height: 1.5; }
.toggle { width: 42px; height: 24px; border-radius: 20px; background: var(--line); position: relative; border: 0; padding: 0; }
.toggle::after { content: ""; width: 18px; height: 18px; border-radius: 50%; background: white; position: absolute; top: 3px; left: 3px; transition: .18s ease; box-shadow: 0 2px 5px rgba(0,0,0,.18); }
.toggle.on { background: var(--primary); }
.toggle.on::after { transform: translateX(18px); }

.search-results { position: absolute; top: calc(100% + 8px); left: 0; right: 0; max-height: 430px; overflow: auto; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; box-shadow: var(--shadow); padding: 8px; z-index: 80; }
.search-group-title { padding: 8px 10px; color: var(--muted); font-size: 9px; text-transform: uppercase; letter-spacing: .8px; }
.search-result { width: 100%; border: 0; border-radius: 9px; background: transparent; color: var(--text); padding: 10px; text-align: left; display: grid; grid-template-columns: 34px 1fr; gap: 10px; }
.search-result:hover { background: var(--surface-2); }
.search-result .result-icon { width: 32px; height: 32px; border-radius: 9px; background: var(--primary-soft); color: var(--primary); display: grid; place-items: center; }
.search-result strong { display: block; font-size: 11px; }
.search-result span { display: block; color: var(--muted); font-size: 9px; margin-top: 3px; }

.notification-panel { position: fixed; top: var(--topbar); right: 0; bottom: 0; width: min(390px, 100vw); background: var(--surface); border-left: 1px solid var(--line); z-index: 55; box-shadow: -12px 0 30px rgba(15,23,42,.12); transform: translateX(100%); transition: transform .22s ease; }
.notification-panel.open { transform: translateX(0); }
.notification-panel .panel-head { padding: 18px; border-bottom: 1px solid var(--line); display: flex; align-items: center; justify-content: space-between; }
.notification-panel .panel-body { overflow-y: auto; height: calc(100% - 68px); padding: 10px; }
.notification-item { width: 100%; border: 0; background: transparent; color: var(--text); text-align: left; padding: 12px; border-radius: 11px; display: grid; grid-template-columns: 35px 1fr; gap: 10px; }
.notification-item:hover { background: var(--surface-2); }
.notification-item.unread { background: var(--primary-soft); }
.notification-item strong { font-size: 11px; display: block; }
.notification-item p { margin: 4px 0 5px; color: var(--muted); font-size: 10px; line-height: 1.4; }
.notification-item time { font-size: 9px; color: var(--muted); }

.file-chip { display: inline-flex; align-items: center; gap: 7px; padding: 6px 9px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface-2); font-size: 10px; margin: 3px 3px 3px 0; }

@media print {
  .sidebar, .topbar, .page-toolbar .toolbar-actions, .filter-bar, .no-print { display: none !important; }
  .main-content { margin: 0; padding: 0; }
  body, .card, .table-card { background: white !important; color: black !important; box-shadow: none !important; }

}

@media (max-width: 1250px) {
  .grid-5 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .grid-4 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}
@media (max-width: 980px) {
  .auth-shell { grid-template-columns: 1fr; }
  .auth-visual { min-height: auto; padding: 36px; }
  .auth-hero { margin: 70px 0; }
  .auth-panel { padding: 24px; }
  .sidebar { transform: translateX(-100%); }
  .sidebar.open { transform: translateX(0); }
  .topbar { left: 0; padding: 0 14px; }
  .main-content { margin-left: 0; padding-left: 14px; padding-right: 14px; }
  .mobile-menu-btn { display: grid; }
  .page-heading small { display: none; }
  .topbar-left { min-width: auto; }
  .topbar-search { max-width: none; }
  .grid-3 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .validation-summary { grid-template-columns: repeat(3, 1fr); }
}
@media (max-width: 680px) {
  .auth-visual { display: none; }
  .auth-panel { min-height: 100vh; padding: 16px; }
  .auth-card { padding: 24px; border-radius: 18px; }
  .topbar-search { display: none; }
  .page-toolbar { flex-direction: column; }
  .toolbar-actions { width: 100%; justify-content: flex-start; }
  .grid-2, .grid-3, .grid-4, .grid-5 { grid-template-columns: 1fr; }
  .form-grid { grid-template-columns: 1fr; }
  .kpi-card { min-height: 92px; }
  .filter-bar { display: grid; grid-template-columns: 1fr; }
  .filter-bar .filter-item { width: 100%; min-width: 0; }
  .validation-summary { grid-template-columns: repeat(2, 1fr); }
  .import-steps { grid-template-columns: repeat(2, 1fr); }
  .timeline { display: block; overflow: visible; padding-left: 14px; }
  .timeline-stage { min-width: 0; width: 100%; display: grid; grid-template-columns: 54px 1fr; text-align: left; padding: 0 0 22px; }
  .timeline-stage::before { width: 4px; height: calc(100% - 18px); left: 22px; top: -50%; right: auto; }
  .stage-circle { margin: 0; grid-row: 1 / span 2; }
  .stage-name { padding-top: 6px; }
  .stage-meta { margin-top: 2px; }
  .modal-backdrop { padding: 0; align-items: flex-end; }
  .modal { width: 100%; max-height: 94vh; border-radius: 20px 20px 0 0; }
}

/* Supabase authentication additions */
.auth-row{display:flex;justify-content:flex-end;margin:-2px 0 14px}.auth-link{border:0;background:transparent;color:var(--primary);font:inherit;font-weight:700;cursor:pointer;padding:4px 0}.auth-link:hover{text-decoration:underline}.auth-secondary{margin-top:10px}.password-rules{font-size:12px;line-height:1.5;color:var(--text-muted);background:var(--surface-2);border:1px solid var(--border);border-radius:10px;padding:10px 12px;margin:-2px 0 14px}.auth-card .info-banner{margin-bottom:18px}.auth-card button:disabled,.auth-card input:disabled,.auth-card select:disabled{opacity:.65;cursor:not-allowed}

  </style>
</head>
<body>
  <div id="app"><div style="min-height:100vh;display:grid;place-items:center;font-family:Arial,sans-serif"><div>Loading Factory ERP…</div></div></div>
  <input id="excel-file-input" type="file" accept=".xlsx,.xls,.csv" hidden />
  <input id="backup-file-input" type="file" accept=".json" hidden />
  <noscript>This ERP requires JavaScript.</noscript>
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
(() => {
  'use strict';

  const STORAGE_KEY = 'factoryERP_vanilla_v5_executive_stage';
  const LEGACY_STORAGE_KEYS = ['factoryERP_vanilla_v1', 'factoryERP_vanilla_v2', 'factoryERP_vanilla_v3_production', 'factoryERP_vanilla_v4_operations'];
  LEGACY_STORAGE_KEYS.forEach(key => localStorage.removeItem(key));
  const STAGES = [
    'PLANNING', 'MRN - STORES', 'CUTTING', 'FABRICATION', 'GRINDING',
    'PRE-COATING', 'POWDER COATING', 'ASSEMBLY', 'READY FOR DISPATCH'
  ];

  const TEMPLATE_HEADERS = [
    'PROJECT NAME', 'ITEM NAME', 'SITE DETAILS', 'SIZE', 'BOM', 'QTY',
    'BOM NUMBER', 'JOB NO', 'BOM ISSUE DATE', 'DRAWING ISSUE DATE',
    'INDENT NO', 'INDENT ISSUE DATE', 'TENT DEL DATE', 'SHORTAGES', 'STATUS'
  ];

  const ICONS = {
    dashboard: '▦', projects: '▣', production: '⚙', import: '⇧', reports: '▤',
    users: '♙', audit: '◷', settings: '⚒', shortage: '⚠', logout: '↪',
    search: '⌕', bell: '♢', menu: '☰', theme: '◐', plus: '+', edit: '✎',
    view: '◉', delete: '×', download: '⇩', upload: '⇧', check: '✓', clock: '◷',
    project: '▧', item: '◫', factory: '⌂', target: '◎', issue: '!', ready: '➜'
  };

  const NAV = [
    { id: 'dashboard', label: 'Factory Overview', icon: ICONS.dashboard, roles: ['ADMIN','MANAGER','EXECUTIVE'], section: 'Overview' },
    { id: 'projects', label: 'Projects', icon: ICONS.projects, roles: ['ADMIN','MANAGER','EXECUTIVE'], section: 'Operations' },
    { id: 'production', label: 'Production Tracker', icon: ICONS.production, roles: ['ADMIN','MANAGER','EXECUTIVE'], section: 'Operations' },
    { id: 'shortages', label: 'Shortages & Issues', icon: ICONS.shortage, roles: ['ADMIN','MANAGER','EXECUTIVE'], section: 'Operations' },
    { id: 'import', label: 'Excel Import', icon: ICONS.import, roles: ['ADMIN','MANAGER'], section: 'Data & Reports' },
    { id: 'reports', label: 'Reports', icon: ICONS.reports, roles: ['ADMIN','MANAGER','EXECUTIVE'], section: 'Data & Reports' },
    { id: 'users', label: 'User Management', icon: ICONS.users, roles: ['ADMIN','MANAGER'], section: 'Administration' },
    { id: 'audit', label: 'Audit Logs', icon: ICONS.audit, roles: ['ADMIN'], section: 'Administration' },
    { id: 'settings', label: 'Settings & Backup', icon: ICONS.settings, roles: ['ADMIN'], section: 'Administration' }
  ];

  let state = loadState();
  let currentRoute = 'dashboard';
  let supabaseClient = null;
  let authSession = null;
  let currentProfile = null;
  let appConfig = null;
  let setupRequired = false;
  let authInitialized = false;
  let authView = 'login';
  let authMessage = '';
  let passwordFlow = '';
  let importBuffer = null;
  let globalSearchTimer = null;

  function defaultState() {
    return {
      version: 6,
      settings: {
        companyName: 'Factory ERP',
        factoryName: 'Main Manufacturing Unit',
        theme: 'light',
        dateFormat: 'DD/MM/YYYY',
        notifications: true
      },
      users: [],
      projects: [],
      items: [],
      shortages: [],
      issues: [],
      audit: [],
      notifications: []
    };
  }

  function loadState() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      const loaded = raw ? { ...defaultState(), ...JSON.parse(raw) } : defaultState();
      loaded.users = (loaded.users || []).map(({ password, ...user }) => user);
      return loaded;
    } catch (e) {
      console.error('State load failed', e);
      return defaultState();
    }
  }

  function saveState() {
    const safeState = { ...state, users: (state.users || []).map(({ password, ...user }) => user) };
    localStorage.setItem(STORAGE_KEY, JSON.stringify(safeState));
  }

  function uid(prefix = 'ID') {
    return `${prefix}-${Date.now().toString(36)}-${Math.random().toString(36).slice(2, 8)}`.toUpperCase();
  }

  function nowISO() { return new Date().toISOString(); }
  function todayISO() { return new Date().toISOString().slice(0, 10); }
  function esc(value = '') {
    return String(value).replace(/[&<>'"]/g, ch => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', "'":'&#39;', '"':'&quot;' }[ch]));
  }
  function number(value) { return Number(value || 0); }
  function fmtNumber(value) { return new Intl.NumberFormat('en-IN', { maximumFractionDigits: 2 }).format(number(value)); }
  function fmtDate(value, includeTime = false) {
    if (!value) return '—';
    const d = new Date(value);
    if (Number.isNaN(d.getTime())) return esc(value);
    return new Intl.DateTimeFormat('en-GB', includeTime ? {
      day:'2-digit', month:'short', year:'numeric', hour:'2-digit', minute:'2-digit'
    } : { day:'2-digit', month:'short', year:'numeric' }).format(d);
  }
  function initials(name = '') { return name.split(/\s+/).filter(Boolean).slice(0,2).map(x => x[0]).join('').toUpperCase() || 'U'; }
  function slugStatus(value='') { return value.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, ''); }
  function statusChip(value) {
    const text = value || 'Pending';
    let cls = 'status-neutral';
    if (/complete|approved|ready|active|resolved/i.test(text)) cls = 'status-completed';
    else if (/delay|reject|hold|critical|open issue/i.test(text)) cls = 'status-delayed';
    else if (/progress|planning|pending|approach/i.test(text)) cls = 'status-pending';
    else if (/submit|assigned|info/i.test(text)) cls = 'status-info';
    return `<span class="status ${cls}">${esc(text)}</span>`;
  }
  function getCurrentUser() { return currentProfile || state.users.find(u => u.id === authSession?.user?.id) || null; }
  function can(...roles) { return roles.includes(getCurrentUser()?.role); }
  function roleLabel(role) { return role === 'ADMIN' ? 'SUPER ADMIN' : role; }
  function requireRole(...roles) {
    if (can(...roles)) return true;
    toast('Access denied', 'Your role does not have permission to perform this action.', 'error');
    return false;
  }
  function manageableExecutives(managerId = getCurrentUser()?.id) {
    if (!managerId) return [];
    const assigned = new Set(state.projects.filter(p => p.managerId === managerId).flatMap(p => p.executiveIds || []));
    return state.users.filter(u => u.role === 'EXECUTIVE' && (u.createdBy === managerId || assigned.has(u.id)));
  }
  function canManageUser(target) {
    const current = getCurrentUser();
    if (!current || !target || target.role === 'ADMIN' || target.id === current.id) return false;
    if (current.role === 'ADMIN') return true;
    return current.role === 'MANAGER' && target.role === 'EXECUTIVE' && target.createdBy === current.id;
  }
  function generateTemporaryPassword(length = 14) {
    const groups = ['ABCDEFGHJKLMNPQRSTUVWXYZ', 'abcdefghijkmnopqrstuvwxyz', '23456789', '!@#$%&*?'];
    const all = groups.join('');
    const pick = chars => chars[crypto.getRandomValues(new Uint32Array(1))[0] % chars.length];
    const chars = groups.map(pick);
    while (chars.length < length) chars.push(pick(all));
    for (let i = chars.length - 1; i > 0; i--) {
      const j = crypto.getRandomValues(new Uint32Array(1))[0] % (i + 1);
      [chars[i], chars[j]] = [chars[j], chars[i]];
    }
    return chars.join('');
  }
  function projectById(id) { return state.projects.find(p => p.id === id); }
  function userById(id) { return state.users.find(u => u.id === id); }
  function itemById(id) { return state.items.find(i => i.id === id); }
  function assignedProjects() {
    const user = getCurrentUser();
    if (!user) return [];
    return state.projects;
  }
  function visibleItems() {
    const allowed = new Set(assignedProjects().map(p => p.id));
    return state.items.filter(i => allowed.has(i.projectId));
  }
  function canUpdateItemStage(item) {
    const user=getCurrentUser();
    return Boolean(user && item && ['ADMIN','MANAGER','EXECUTIVE'].includes(user.role));
  }
  function completionPercent(item) {
    if (!item) return 0;
    if (item.status === 'Completed' || item.currentStage >= STAGES.length - 1) return 100;
    const base = Math.max(0, Math.min(STAGES.length - 1, Number(item.currentStage || 0)));
    const pct = Math.round((base / (STAGES.length - 1)) * 100);
    return item.approvalStatus === 'SUBMITTED' ? Math.min(99, pct + 6) : pct;
  }
  function projectCompletion(projectId) {
    const items = state.items.filter(i => i.projectId === projectId);
    if (!items.length) return 0;
    return Math.round(items.reduce((a, i) => a + completionPercent(i), 0) / items.length);
  }
  function audit(action, module, details, entityId = '') {
    const user = getCurrentUser();
    state.audit.unshift({
      id: uid('AUD'), action, module, details, entityId,
      userId: user?.id || 'SYSTEM', userName: user?.name || 'System', createdAt: nowISO()
    });
    state.audit = state.audit.slice(0, 1000);
  }
  function notify(userId, title, message, type = 'Info', entityId = '') {
    if (!userId) return;
    state.notifications.unshift({ id: uid('NOT'), userId, title, message, type, entityId, read: false, createdAt: nowISO() });
    state.notifications = state.notifications.slice(0, 500);
  }
  function toast(title, message = '', type = 'success') {
    let c = document.querySelector('.toast-container');
    if (!c) {
      c = document.createElement('div'); c.className = 'toast-container'; document.body.appendChild(c);
    }
    const el = document.createElement('div');
    el.className = `toast ${type}`;
    el.innerHTML = `<div>${type === 'error' ? '!' : type === 'warning' ? '⚠' : '✓'}</div><div><strong>${esc(title)}</strong><span>${esc(message)}</span></div>`;
    c.appendChild(el);
    setTimeout(() => el.remove(), 3600);
  }


  function render() {
    document.documentElement.setAttribute('data-theme', state.settings.theme || 'light');
    if (!authInitialized) return renderAuthLoading();
    if (authView === 'set-password') return renderSetPassword();
    if (!authSession || !getCurrentUser()) return renderAuth();
    renderAppShell();
  }

  function renderAuthLoading() {
    document.getElementById('app').innerHTML = `<div class="auth-shell"><section class="auth-visual"><div class="brand-lockup"><div class="brand-mark">ERP</div><div><h1>${esc(state.settings.companyName)}</h1><p>Manufacturing Operations Platform</p></div></div><div class="auth-hero"><h2>Secure authentication is loading.</h2><p>Connecting to Supabase Authentication and checking the ERP configuration.</p></div></section><section class="auth-panel"><div class="auth-card"><div class="empty-state"><div class="empty-icon">◷</div><h3>Please wait</h3><p>Loading secure sign-in…</p></div></div></section></div>`;
  }

  function renderAuth() {
    document.getElementById('app').innerHTML = `
      <div class="auth-shell">
        <section class="auth-visual">
          <div class="brand-lockup"><div class="brand-mark">ERP</div><div><h1>${esc(state.settings.companyName)}</h1><p>Manufacturing Operations Platform</p></div></div>
          <div class="auth-hero">
            <h2>Control every production stage from one place.</h2>
            <p>Secure temporary passwords, forced first-login password changes, role-based access, projects, BOM items, shortages, reports and production tracking.</p>
            <div class="auth-stats">
              <div class="auth-stat"><strong>9</strong><span>Production stages</span></div>
              <div class="auth-stat"><strong>3</strong><span>Role levels</span></div>
              <div class="auth-stat"><strong>1×</strong><span>Temporary password</span></div>
            </div>
          </div>
          <div class="auth-foot">Supabase Auth + Netlify Functions • SMTP and invitation emails are not required</div>
        </section>
        <section class="auth-panel"><div class="auth-card">
          ${authMessage ? `<div class="info-banner ${authMessage.startsWith('ERROR:') ? 'danger' : ''}"><div>${authMessage.startsWith('ERROR:') ? '!' : '✓'}</div><div><p>${esc(authMessage.replace(/^ERROR:\s*/,''))}</p></div></div>` : ''}
          ${setupRequired ? setupForm() : loginForm()}
        </div></section>
      </div>`;
    bindAuthEvents();
  }

  function setupForm() {
    return `
      <h2>Create First Super Admin</h2>
      <p>This one-time setup creates the first secured administrator in Supabase.</p>
      <form id="setup-form">
        <div class="form-group"><label>Full name</label><input name="name" required placeholder="Your full name" autocomplete="name"></div>
        <div class="form-group"><label>Email Address</label><input name="email" type="email" required placeholder="admin@yourcompany.com" autocomplete="email"></div>
        <div class="form-group"><label>Password</label><input name="password" type="password" required minlength="10" placeholder="Strong password" autocomplete="new-password"></div>
        <div class="form-group"><label>Confirm password</label><input name="confirm" type="password" required minlength="10" placeholder="Repeat password" autocomplete="new-password"></div>
        <div class="password-rules">Use at least 10 characters with uppercase, lowercase, number and special character.</div>
        <button class="btn btn-primary btn-lg w-100" type="submit">Create Super Admin</button>
      </form>`;
  }

  function loginForm() {
    return `
      <h2>Welcome back</h2>
      <p>Sign in using your email address and password. New users must use the temporary password supplied by their administrator.</p>
      <form id="login-form">
        <div class="form-group"><label>Email Address</label><input name="email" type="email" required placeholder="name@company.com" autocomplete="username"></div>
        <div class="form-group"><label>Password</label><input name="password" type="password" required placeholder="Enter password" autocomplete="current-password"></div>
        <div class="auth-note">Forgot your password? Contact your Super Admin or Manager for a temporary password reset.</div>
        <button class="btn btn-primary btn-lg w-100" type="submit">Sign in</button>
      </form>`;
  }

  function renderSetPassword() {
    document.getElementById('app').innerHTML = `
      <div class="auth-shell">
        <section class="auth-visual"><div class="brand-lockup"><div class="brand-mark">ERP</div><div><h1>${esc(state.settings.companyName)}</h1><p>Required Password Change</p></div></div><div class="auth-hero"><h2>Create your private password.</h2><p>Your administrator supplied a temporary password. Replace it now before accessing the ERP.</p></div><div class="auth-foot">The new password is securely hashed and stored by Supabase Auth.</div></section>
        <section class="auth-panel"><div class="auth-card">
          <h2>Change Temporary Password</h2>
          <p>${esc(authSession?.user?.email || '')}</p>
          <form id="set-password-form">
            <div class="form-group"><label>New Password</label><input name="password" type="password" required minlength="10" autocomplete="new-password"></div>
            <div class="form-group"><label>Confirm Password</label><input name="confirm" type="password" required minlength="10" autocomplete="new-password"></div>
            <div class="password-rules">Minimum 10 characters, including uppercase, lowercase, number and special character.</div>
            <button class="btn btn-primary btn-lg w-100" type="submit">Save New Password</button>
          </form>
        </div></section>
      </div>`;
    document.getElementById('set-password-form').addEventListener('submit', completePasswordFlow);
  }

  function strongPassword(value) {
    return value.length >= 10 && /[a-z]/.test(value) && /[A-Z]/.test(value) && /\d/.test(value) && /[^A-Za-z0-9]/.test(value);
  }

  async function bindAuthEvents() {
    const setup = document.getElementById('setup-form');
    if (setup) setup.addEventListener('submit', async e => {
      e.preventDefault();
      const fd = new FormData(setup), name = String(fd.get('name') || '').trim(), email = String(fd.get('email') || '').trim().toLowerCase(), password = String(fd.get('password') || ''), confirm = String(fd.get('confirm') || '');
      if (password !== confirm) return toast('Password mismatch', 'Both passwords must be the same.', 'error');
      if (!strongPassword(password)) return toast('Weak password', 'Use 10+ characters with uppercase, lowercase, number and special character.', 'error');
      setFormBusy(setup, true);
      try {
        await callAuthAdmin('bootstrap', { fullName: name, email, password }, false);
        setupRequired = false;
        const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });
        if (error) throw error;
        authSession = data.session;
        await syncProfiles();
        currentRoute = 'dashboard';
        authMessage = '';
        render();
        toast('ERP setup completed', 'Your secure Super Admin account is ready.');
      } catch (error) { toast('Setup failed', error.message, 'error'); }
      finally { setFormBusy(setup, false); }
    });

    const login = document.getElementById('login-form');
    if (login) login.addEventListener('submit', async e => {
      e.preventDefault();
      const fd = new FormData(login), email = String(fd.get('email') || '').trim().toLowerCase(), password = String(fd.get('password') || '');
      setFormBusy(login, true);
      const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });
      if (error) { setFormBusy(login, false); return toast('Login failed', error.message || 'Check your email and password.', 'error'); }
      authSession = data.session;
      try {
        await syncProfiles();
        if (!currentProfile || currentProfile.status !== 'Active') throw new Error('This account is not active. Contact the Super Admin.');
        if (currentProfile.mustChangePassword) {
          passwordFlow = 'forced'; authView = 'set-password'; authMessage = ''; render();
          return;
        }
        currentRoute = 'dashboard'; authMessage = ''; render();
        audit('LOGIN', 'Authentication', 'User signed in', currentProfile.id); saveState();
      } catch (err) {
        await supabaseClient.auth.signOut(); authSession = null; currentProfile = null;
        toast('Login blocked', err.message, 'error'); render();
      } finally { setFormBusy(login, false); }
    });

  }

  function setFormBusy(form, busy) {
    form?.querySelectorAll('button,input,select').forEach(el => { el.disabled = busy; });
  }

  async function completePasswordFlow(e) {
    e.preventDefault();
    const form = e.currentTarget, fd = new FormData(form), password = String(fd.get('password') || ''), confirm = String(fd.get('confirm') || '');
    if (password !== confirm) return toast('Password mismatch', 'Both passwords must be the same.', 'error');
    if (!strongPassword(password)) return toast('Weak password', 'Use 10+ characters with uppercase, lowercase, number and special character.', 'error');
    setFormBusy(form, true);
    try {
      await callAuthAdmin('change-own-password', { newPassword: password });
      await supabaseClient.auth.signOut();
      authSession = null; currentProfile = null; passwordFlow = ''; authView = 'login';
      authMessage = 'Password changed successfully. Sign in using your email and new password.';
      render();
    } catch (error) { toast('Password update failed', error.message, 'error'); }
    finally { setFormBusy(form, false); }
  }

  async function callAuthAdmin(action, payload = {}, needsSession = true) {
    const headers = { 'Content-Type': 'application/json' };
    if (needsSession) {
      const token = authSession?.access_token;
      if (!token) throw new Error('Your session has expired. Sign in again.');
      headers.Authorization = `Bearer ${token}`;
    }
    const response = await fetch('/api/auth-admin', { method: 'POST', headers, body: JSON.stringify({ action, ...payload }) });
    const body = await response.json().catch(() => ({}));
    if (!response.ok) throw new Error(body.error || 'Authentication request failed.');
    return body;
  }

  async function syncProfiles() {
    if (!supabaseClient || !authSession) return;
    const { data, error } = await supabaseClient.from('profiles').select('id,full_name,email,role,status,must_change_password,created_by,invited_at,activated_at,created_at').order('created_at', { ascending: true });
    if (error) throw error;
    state.users = (data || []).map(row => ({ id: row.id, name: row.full_name, email: row.email, role: row.role, status: titleCase(row.status), mustChangePassword: Boolean(row.must_change_password), createdBy: row.created_by || '', invitedAt: row.invited_at, activatedAt: row.activated_at, createdAt: row.created_at }));
    currentProfile = state.users.find(user => user.id === authSession.user.id) || null;
    saveState();
  }

  function titleCase(value = '') { return value ? value[0].toUpperCase() + value.slice(1).toLowerCase() : ''; }

  async function initialiseAuthentication() {
    renderAuthLoading();
    try {
      const response = await fetch('/api/config', { cache: 'no-store' });
      const config = await response.json().catch(() => ({}));
      if (!response.ok) throw new Error(config.error || 'Supabase configuration is unavailable.');
      appConfig = config; setupRequired = Boolean(config.setupRequired);
      if (!window.supabase?.createClient) throw new Error('Supabase client library did not load. Check the internet connection.');
      supabaseClient = window.supabase.createClient(config.supabaseUrl, config.supabasePublishableKey, { auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: true } });
      const { data, error } = await supabaseClient.auth.getSession();
      if (error) throw error;
      authSession = data.session;
      if (authSession) {
        await syncProfiles();
        if (currentProfile?.status !== 'Active') {
          await supabaseClient.auth.signOut();
          authSession = null; currentProfile = null;
          authMessage = 'ERROR:This account is not active. Contact the Super Admin.';
        } else if (currentProfile?.mustChangePassword) {
          passwordFlow = 'forced'; authView = 'set-password';
        }
      }
      authInitialized = true;
      render();
      supabaseClient.auth.onAuthStateChange((event, nextSession) => {
        setTimeout(async () => {
          authSession = nextSession;
          if (nextSession) {
            try {
              await syncProfiles();
              if (currentProfile?.status !== 'Active') {
                await supabaseClient.auth.signOut(); authSession = null; currentProfile = null;
                authMessage = 'ERROR:This account is not active. Contact the Super Admin.';
              } else if (currentProfile?.mustChangePassword) {
                passwordFlow = 'forced'; authView = 'set-password';
              }
            } catch (error) { console.error('Profile sync failed', error); }
          } else currentProfile = null;
          if (authInitialized) render();
        }, 0);
      });
    } catch (error) {
      authInitialized = true; authSession = null; currentProfile = null; setupRequired = false;
      authMessage = `ERROR:${error.message}`; render();
    }
  }

  function bindShellEvents() {
    document.querySelectorAll('[data-route]').forEach(btn => btn.addEventListener('click', () => {
      currentRoute = btn.dataset.route;

    document.querySelectorAll('[data-action="theme"]').forEach(btn => btn.addEventListener('click', toggleTheme));

    document.querySelectorAll('[data-action="mark-all-read"]').forEach(btn => btn.addEventListener('click', markAllRead));
    const search = document.getElementById('global-search');

    audit('LOGOUT', 'Authentication', 'User signed out', getCurrentUser()?.id);

  function drawBarChart(canvasId, data, options={}) {
    const canvas = document.getElementById(canvasId); if (!canvas) return;
    const rect = canvas.getBoundingClientRect(); const dpr = window.devicePixelRatio || 1;
    canvas.width = Math.max(300, rect.width*dpr); canvas.height = Math.max(220, rect.height*dpr);
    const ctx = canvas.getContext('2d'); ctx.scale(dpr,dpr);
    const w=canvas.width/dpr,h=canvas.height/dpr, pad={l:42,r:15,t:20,b:62};
    ctx.clearRect(0,0,w,h);
    const style=getComputedStyle(document.documentElement), line=style.getPropertyValue('--line').trim(), text=style.getPropertyValue('--muted').trim(), primary=style.getPropertyValue('--primary').trim();
    const max = options.max || Math.max(1,...data.map(d=>d.value))*1.18;
    ctx.strokeStyle=line;ctx.fillStyle=text;ctx.font='10px system-ui';ctx.textAlign='right';
    for(let i=0;i<=4;i++){const y=pad.t+(h-pad.t-pad.b)*(i/4);ctx.beginPath();ctx.moveTo(pad.l,y);ctx.lineTo(w-pad.r,y);ctx.stroke();const v=Math.round(max*(1-i/4));ctx.fillText(v+(options.suffix||''),pad.l-7,y+3);}
    const chartW=w-pad.l-pad.r, gap=8, bw=Math.max(8,(chartW/data.length)-gap);
    data.forEach((d,i)=>{const x=pad.l+i*(chartW/data.length)+gap/2;const bh=(h-pad.t-pad.b)*(d.value/max);const y=h-pad.b-bh;ctx.fillStyle=primary;roundRect(ctx,x,y,bw,bh,5);ctx.fill();ctx.fillStyle=text;ctx.textAlign='center';ctx.save();ctx.translate(x+bw/2,h-pad.b+10);ctx.rotate(-0.45);ctx.fillText(d.label,0,0);ctx.restore();ctx.fillStyle=style.getPropertyValue('--text').trim();ctx.font='bold 10px system-ui';ctx.fillText(d.value+(options.suffix||''),x+bw/2,y-6);});
  }
  function roundRect(ctx,x,y,w,h,r){r=Math.min(r,w/2,h/2);ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}

  function updateItemStageDirect(itemId, nextStageValue) {
    if(!requireRole('ADMIN','MANAGER','EXECUTIVE'))return;
    const item=itemById(itemId);
    if(!item||!visibleItems().some(x=>x.id===itemId)||!canUpdateItemStage(item))return toast('Access denied','You must be logged in to update a production stage.','error');
    const nextStage=Number(nextStageValue);
    if(!Number.isInteger(nextStage)||nextStage<0||nextStage>=STAGES.length)return toast('Invalid stage','Select a valid production stage.','error');
    const previousStage=Number(item.currentStage||0);
    if(previousStage===nextStage)return;
    const previousStageName=STAGES[previousStage]||'UNKNOWN';
    item.currentStage=nextStage;
    item.currentStageName=STAGES[nextStage];
    item.approvalStatus='';
    if(item.status==='Completed'&&nextStage<STAGES.length-1)item.status='In Progress';
    item.updatedAt=nowISO();
    item.history=item.history||[];
    item.history.push(historyEvent(item,'Stage Changed',item.status||'In Progress',`Current stage changed directly from ${previousStageName} to ${STAGES[nextStage]} in Production Tracker.`));
    audit('UPDATE','Production',`Changed ${item.itemName} stage from ${previousStageName} to ${STAGES[nextStage]}`,item.id);
    saveState();
    renderProduction();
    toast('Production stage updated',`${item.itemName} moved to ${STAGES[nextStage]}.`);
  }

  async function processImportFile(file) {

    try {
      let rows=[],headers=[];
      if(file.name.toLowerCase().endsWith('.csv')) { const parsed=parseCSV(await file.text()); rows=parsed.rows; headers=parsed.headers; }
      else {
        if(typeof XLSX==='undefined') throw new Error('XLSX library could not load. Check your internet connection or save the sheet as CSV.');
        const data=await file.arrayBuffer(),wb=XLSX.read(data,{type:'array',cellDates:false});
        const sheetName=wb.SheetNames.find(n=>n.trim().toUpperCase()==='MASTER SHEET')||wb.SheetNames[0];
        const sheet=wb.Sheets[sheetName];
        const matrix=XLSX.utils.sheet_to_json(sheet,{header:1,defval:'',raw:true});
        headers=(matrix[0]||[]).map(x=>String(x||''));
        rows=XLSX.utils.sheet_to_json(sheet,{defval:'',raw:true});
      }
      const missing=validateTemplateHeaders(headers);
      if(missing.length) throw new Error(`Required column(s) missing: ${missing.join(', ')}. Download and use the ERP Excel template without changing its headers.`);
      if(!rows.length) throw new Error('The file contains the correct headers but no data rows. Add records below the header row and upload it again.');
      const parsed=validateImportRows(rows);importBuffer={fileName:file.name,...parsed};renderImportPreview();
    } catch(e){result.innerHTML=`<div class="info-banner danger"><div>!</div><div><strong>Unable to validate file</strong><p>${esc(e.message)}</p></div></div>`;}
  }
  function parseCSV(text){const lines=text.replace(/^\uFEFF/,'').split(/\r?\n/).filter(x=>x.trim());if(!lines.length)return{headers:[],rows:[]};const parseLine=line=>{const out=[];let v='',q=false;for(let i=0;i<line.length;i++){const c=line[i];if(c==='"'&&line[i+1]==='"'){v+='"';i++;}else if(c==='"')q=!q;else if(c===','&&!q){out.push(v.trim());v='';}else v+=c;}out.push(v.trim());return out;};const headers=parseLine(lines[0]);const rows=lines.slice(1).map(l=>{const vals=parseLine(l),o={};headers.forEach((h,i)=>o[h]=vals[i]??'');return o;});return{headers,rows};}
  function cleanKey(k){return String(k||'').trim().toUpperCase().replace(/\s+/g,' ');}
  function validateTemplateHeaders(headers){const available=new Set(headers.map(cleanKey).filter(Boolean));return TEMPLATE_HEADERS.filter(h=>!available.has(cleanKey(h)));}
  function getCol(row,...names){const map={};Object.entries(row).forEach(([k,v])=>map[cleanKey(k)]=v);for(const n of names){if(map[cleanKey(n)]!==undefined)return map[cleanKey(n)];}return '';}

  function excelDate(value){if(value===0||value==='0'||value===''||value==null)return'';if(typeof value==='number'){const d=new Date(Math.round((value-25569)*86400*1000));return Number.isNaN(d.getTime())?'':d.toISOString().slice(0,10);}const s=String(value).trim();const dmy=s.match(/^(\d{1,2})[\/-](\d{1,2})[\/-](\d{4})$/);if(dmy){const d=new Date(`${dmy[3]}-${dmy[2].padStart(2,'0')}-${dmy[1].padStart(2,'0')}T00:00:00`);return Number.isNaN(d.getTime())?'':d.toISOString().slice(0,10);}const d=new Date(s);return Number.isNaN(d.getTime())?'':d.toISOString().slice(0,10);}
  function extractQty(name){const matches=[...String(name||'').matchAll(/(\d+(?:\.\d+)?)\s*(?:NOS?\.?|PCS?\.?|PIECES?)/gi)];return matches.length?number(matches[matches.length-1][1]):0;}

  function validateImportRows(rows){const valid=[],failed=[],warnings=[],seen=new Set();rows.forEach((r,index)=>{const itemName=String(getCol(r,'ITEM NAME')).trim(),projectName=String(getCol(r,'PROJECT NAME')).trim(),statusRaw=getCol(r,'STATUS'),stage=canonicalStage(statusRaw),qtyCell=getCol(r,'QTY'),qtyText=String(qtyCell??'').trim(),qtyParsed=qtyText===''?0:Number(qtyCell),suggested=extractQty(itemName),qty=Number.isFinite(qtyParsed)&&qtyParsed>0?qtyParsed:suggested;const dateFields=[['BOM ISSUE DATE','bomIssueDate'],['DRAWING ISSUE DATE','drawingIssueDate'],['INDENT ISSUE DATE','indentIssueDate'],['TENT DEL DATE','targetDate']];const dates={};const dateErrors=[];dateFields.forEach(([header,key])=>{const raw=getCol(r,header);dates[key]=excelDate(raw);if(String(raw??'').trim()&&!dates[key])dateErrors.push(`${header} has an invalid date`);});const rec={sourceRow:index+2,projectName,itemName,site:String(getCol(r,'SITE DETAILS')).trim(),size:String(getCol(r,'SIZE')).trim()||extractSize(itemName),bomPath:String(getCol(r,'BOM')).trim(),quantity:qty,quantitySource:Number.isFinite(qtyParsed)&&qtyParsed>0?'Excel Column':suggested>0?'Item Description':'Missing',quantityVerified:Number.isFinite(qtyParsed)&&qtyParsed>0,bomNumber:String(getCol(r,'BOM NUMBER')).trim(),jobNumber:String(getCol(r,'JOB NO')).trim(),...dates,indentNumber:String(getCol(r,'INDENT NO')).trim(),shortages:String(getCol(r,'SHORTAGES')).trim(),stage,statusRaw:String(statusRaw||'').trim(),raw:r,errors:[],warnings:[]};if(!projectName)rec.errors.push('PROJECT NAME is required');if(!itemName)rec.errors.push('ITEM NAME is required');if(!stage)rec.errors.push(`STATUS is invalid: ${rec.statusRaw||'blank'}`);if(qtyText!==''&&(!Number.isFinite(qtyParsed)||qtyParsed<=0))rec.errors.push('QTY must be a number greater than zero');if(qtyText===''&&!suggested)rec.errors.push('QTY is required unless a quantity such as 10 NOS is present in ITEM NAME');if(suggested>0&&qtyText==='')rec.warnings.push('Quantity extracted from
